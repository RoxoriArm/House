<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Namų paieška — Klaipėda ir rajonas</title>
<style>
:root{
  --popierius:#eef1f0;
  --rasalas:#17272b;
  --gelme:#123037;
  --pilka:#5d7378;
  --linija:#c9d4d3;
  --nauja:#8a6a12;
  --atpigo:#1c6b4a;
  --pabrango:#9b3b23;
  --balta:#fbfcfc;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--popierius);color:var(--rasalas);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
h1,h2,.kaina,.vieta{font-family:"Iowan Old Style",Palatino,Georgia,serif}

header{background:var(--gelme);color:#dfe8e7;padding:22px 18px 18px}
.vidus{max-width:1060px;margin:0 auto}
h1{margin:0;font-size:1.45rem;font-weight:600;letter-spacing:.2px}
.meta{margin-top:6px;font-size:.85rem;color:#9fb5b4}

.filtrai{
  position:sticky;top:0;z-index:5;background:var(--balta);
  border-bottom:1px solid var(--linija);padding:10px 18px;
}
.filtrai .vidus{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
label{font-size:.78rem;color:var(--pilka);display:block;margin-bottom:2px}
select,input[type=number]{
  font:inherit;font-size:.9rem;padding:5px 8px;border:1px solid var(--linija);
  border-radius:3px;background:var(--balta);color:var(--rasalas);min-width:112px;
}
.suma{margin-left:auto;font-size:.9rem;color:var(--pilka)}
.suma b{color:var(--rasalas);font-size:1.05rem}

main{max-width:1060px;margin:0 auto;padding:16px 18px 60px}

.irasas{
  display:grid;grid-template-columns:132px 1fr auto;gap:16px;
  padding:16px 0;border-bottom:1px solid var(--linija);align-items:start;
}
.irasas img{width:132px;height:96px;object-fit:cover;border-radius:2px;background:#dde5e4}
.vieta{font-size:1.08rem;font-weight:600;margin:0 0 4px;line-height:1.3}
.vieta a{color:var(--rasalas);text-decoration:none}
.vieta a:hover,.vieta a:focus{text-decoration:underline}
.duom{font-size:.88rem;color:var(--pilka)}
.duom span{margin-right:12px;white-space:nowrap}
.duom b{color:var(--rasalas);font-weight:600}
.saltinis{font-size:.75rem;color:var(--pilka);margin-top:6px}
.desine{text-align:right;white-space:nowrap}
.kaina{font-size:1.35rem;font-weight:600}
.uzm2{font-size:.8rem;color:var(--pilka);margin-top:2px}

.zyma{
  display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.06em;
  padding:2px 7px;border-radius:2px;margin-bottom:5px;color:var(--balta);
}
.z-NAUJAS{background:var(--nauja)}
.z-ATPIGO{background:var(--atpigo)}
.z-PABRANGO{background:var(--pabrango)}
.senakaina{text-decoration:line-through;color:var(--pilka);font-size:.85rem;margin-right:6px}

.zvaig{
  background:none;border:0;cursor:pointer;font-size:1.25rem;line-height:1;
  color:var(--linija);padding:4px;margin-top:6px;
}
.zvaig[aria-pressed="true"]{color:#c9971b}
.zvaig:focus-visible{outline:2px solid var(--gelme);outline-offset:2px}

.tuscia{padding:48px 0;text-align:center;color:var(--pilka)}
details{margin-top:34px;border-top:1px solid var(--linija);padding-top:14px}
summary{cursor:pointer;font-size:.9rem;color:var(--pilka)}
details ul{font-size:.85rem;color:var(--pilka);line-height:1.7}

/* Pakopinis vietoviu filtras */
.vietoves{margin:0;border:0;padding:0;width:100%}
.vietoves>summary{
  font-size:.82rem;color:var(--gelme);padding:4px 0;list-style:none;
  display:inline-flex;align-items:center;gap:6px;
}
.vietoves>summary::-webkit-details-marker{display:none}
.vietoves>summary::before{content:"▸";font-size:.8rem;transition:none}
.vietoves[open]>summary::before{content:"▾"}
.medis{
  border:1px solid var(--linija);border-radius:3px;background:var(--balta);
  padding:10px 12px;margin-top:6px;max-height:340px;overflow:auto;
  columns:2;column-gap:26px;
}
.medis details{margin:0;border:0;padding:0;break-inside:avoid}
.medis summary{font-size:.85rem;color:var(--rasalas);list-style:none;padding:1px 0}
.medis summary::-webkit-details-marker{display:none}
.mazmena{font-size:.72rem;color:var(--pilka);margin-left:4px}
.eil{display:flex;align-items:center;gap:6px;padding:1px 0;font-size:.85rem}
.eil.gilyn{padding-left:20px;font-size:.8rem;color:var(--pilka)}
.eil input{margin:0;accent-color:var(--gelme)}
.vietoves .veiksmai{margin-top:8px;font-size:.78rem}
.vietoves .veiksmai button{
  font:inherit;background:none;border:1px solid var(--linija);border-radius:3px;
  padding:3px 9px;cursor:pointer;color:var(--gelme);margin-right:6px;
}
@media (max-width:640px){.medis{columns:1}}

@media (max-width:640px){
  .irasas{grid-template-columns:88px 1fr;gap:12px}
  .irasas img{width:88px;height:70px}
  .desine{grid-column:2;text-align:left;margin-top:6px}
  .suma{width:100%;margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="vidus">
    <h1>Namai Klaipėdoje ir Klaipėdos rajone</h1>
    <p class="meta" id="antraste">Kraunama…</p>
  </div>
</header>

<div class="filtrai">
  <div class="vidus">
    <div><label for="fKaina">Kaina iki</label>
      <select id="fKaina">
        <option value="">bet kokia</option>
        <option value="120000">120 000 €</option>
        <option value="160000">160 000 €</option>
        <option value="200000">200 000 €</option>
        <option value="250000">250 000 €</option>
        <option value="300000">300 000 €</option>
        <option value="400000">400 000 €</option>
      </select></div>
    <div><label for="fPlotas">Plotas nuo</label>
      <select id="fPlotas">
        <option value="90">90 m²</option>
        <option value="110">110 m²</option>
        <option value="130">130 m²</option>
        <option value="150">150 m²</option>
      </select></div>
    <div><label for="fMetai">Statyta nuo</label>
      <select id="fMetai">
        <option value="">bet kada</option>
        <option value="1970">1970</option>
        <option value="1990">1990</option>
        <option value="2000">2000</option>
        <option value="2010">2010</option>
        <option value="2018">2018</option>
      </select></div>
    <div><label for="fZona">Vieta</label>
      <select id="fZona">
        <option value="">visos</option>
        <option value="A">tik Klaipėdos miestas</option>
        <option value="AB">miestas + Sendvario sen.</option>
        <option value="ABC">be tolimo rajono</option>
      </select></div>
    <div><label for="fBiudzetas">Biudžetas</label>
      <select id="fBiudzetas">
        <option value="">visi</option>
        <option value="1">telpa į 200 000 € su įrengimu</option>
      </select></div>
    <div><label for="fRikiuoti">Rikiuoti</label>
      <select id="fRikiuoti">
        <option value="balas">tinkamiausi viršuje</option>
        <option value="kaina">pigiausi viršuje</option>
        <option value="kaina-desc">brangiausi viršuje</option>
        <option value="plotas-desc">didžiausi viršuje</option>
        <option value="uzm2">pigiausi už m²</option>
      </select></div>
    <div><label for="fZvaig">Rodyti</label>
      <select id="fZvaig">
        <option value="">visus</option>
        <option value="1">tik pažymėtus</option>
      </select></div>
    <p class="suma"><b id="kiek">0</b> namų</p>

    <details class="vietoves" id="vietPanele">
      <summary id="vietSant">Vietovės: visos</summary>
      <div class="medis" id="vietMedis"></div>
      <div class="veiksmai">
        <button type="button" id="vietVisos">Pažymėti visas</button>
        <button type="button" id="vietJokios">Nuimti visas</button>
        <button type="button" id="vietArti">Tik miestas ir Sendvaris</button>
      </div>
    </details>
  </div>
</div>

<main>
  <div id="sarasas"></div>

  <details id="patikrinti">
    <summary>Reikia peržiūrėti ranka (<span id="kiekPat">0</span>)</summary>
    <ul id="sarasasPat"></ul>
  </details>

  <details id="dingeBlokas" hidden>
    <summary>Dingę nuo praėjusio karto (<span id="kiekDinge">0</span>)</summary>
    <ul id="sarasasDinge"></ul>
  </details>
</main>

<script src="duomenys.js"></script>
<script>
(function(){
  var D = window.DUOMENYS || {skelbimai:[], be_ploto:[], dinge:[], statistika:{}};
  var zvaigzdes = {};
  try { zvaigzdes = JSON.parse(localStorage.getItem("namai_zvaigzdes") || "{}"); } catch(e) {}

  function issaugok(){
    try { localStorage.setItem("namai_zvaigzdes", JSON.stringify(zvaigzdes)); } catch(e) {}
  }
  function eur(n){
    if (n === null || n === undefined) return "—";
    return Math.round(n).toLocaleString("lt-LT") + " €";
  }
  function rajone(r){
    var v = (r.vieta || "") + " " + (r.pavadinimas || "");
    return /r\.|rajon|Gargžd|Priekul|Kretingal|Dovil|Vėžaič|Agluonėn|Slengi|Gindul|Jakai|Kalotė/i.test(v);
  }
  // Senesniuose duomenyse teritorijos lauko dar nebuvo - tada spejam is teksto.
  function teritorija(r){ return r.teritorija || (rajone(r) ? "rajonas" : "miestas"); }

  // ---------------------------------------------------------- vietoviu medis
  // Isjungtos vietoves. Raktai: "miestas", "rajonas", "sen:Sendvario",
  // "gyv:Ginduliai". Medis statomas TIK is to, kas realiai yra sarase -
  // kitaip butu 300 tusciu kaimu pavadinimu.
  var isjungtos = {};
  try { isjungtos = JSON.parse(localStorage.getItem("namai_isjungtos") || "{}"); } catch(e) {}
  function irasykIsjungtas(){
    try { localStorage.setItem("namai_isjungtos", JSON.stringify(isjungtos)); } catch(e) {}
  }

  function praeinaVietove(r){
    if (isjungtos[teritorija(r)]) return false;
    if (r.seniunija && isjungtos["sen:" + r.seniunija]) return false;
    if (r.gyvenviete && isjungtos["gyv:" + r.gyvenviete]) return false;
    return true;
  }

  function medis(){
    var med = {miestas:{kiek:0, vaikai:{}}, rajonas:{kiek:0, vaikai:{}}};
    D.skelbimai.forEach(function(r){
      var t = teritorija(r);
      var m = med[t] || (med[t] = {kiek:0, vaikai:{}});
      m.kiek++;
      var sakos = t === "rajonas"
        ? (r.seniunija || "Gyvenvietė nepatikslinta")
        : "Klaipėdos miestas";
      var s = m.vaikai[sakos] || (m.vaikai[sakos] = {kiek:0, vaikai:{}});
      s.kiek++;
      var g = r.gyvenviete || null;
      if (g) s.vaikai[g] = (s.vaikai[g] || 0) + 1;
    });
    return med;
  }

  function varnele(raktas, tekstas, kiek, gilyn){
    var d = document.createElement("label");
    d.className = "eil" + (gilyn ? " gilyn" : "");
    var i = document.createElement("input");
    i.type = "checkbox";
    i.checked = !isjungtos[raktas];
    i.addEventListener("change", function(){
      if (i.checked) { delete isjungtos[raktas]; } else { isjungtos[raktas] = 1; }
      irasykIsjungtas();
      pieskMedi();
      piesk();
    });
    d.appendChild(i);
    d.appendChild(document.createTextNode(tekstas));
    var s = document.createElement("span");
    s.className = "mazmena";
    s.textContent = kiek;
    d.appendChild(s);
    return d;
  }

  function pieskMedi(){
    var box = document.getElementById("vietMedis");
    box.innerHTML = "";
    var med = medis();

    ["miestas","rajonas"].forEach(function(t){
      if (!med[t] || !med[t].kiek) return;
      var pav = t === "miestas" ? "Klaipėdos miestas" : "Klaipėdos rajonas";
      box.appendChild(varnele(t, pav, med[t].kiek, false));

      Object.keys(med[t].vaikai).sort().forEach(function(sakos){
        var s = med[t].vaikai[sakos];
        if (t === "miestas"){
          Object.keys(s.vaikai).sort().forEach(function(g){
            box.appendChild(varnele("gyv:" + g, g, s.vaikai[g], true));
          });
          return;
        }
        var det = document.createElement("details");
        var sum = document.createElement("summary");
        sum.appendChild(varnele("sen:" + sakos, sakos + " sen.", s.kiek, true));
        det.appendChild(sum);
        Object.keys(s.vaikai).sort().forEach(function(g){
          var e = varnele("gyv:" + g, g, s.vaikai[g], true);
          e.style.paddingLeft = "40px";
          det.appendChild(e);
        });
        box.appendChild(det);
      });
    });

    var n = Object.keys(isjungtos).length;
    document.getElementById("vietSant").textContent =
      n ? ("Vietovės: išjungta " + n) : "Vietovės: visos";
  }

  document.getElementById("antraste").textContent =
    "Atnaujinta " + (D.atnaujinta || "—") +
    " · biudžetas 200 000 € su įrengimu · skelbimai nuo 2025 m." +
    (D.statistika && D.statistika.nauji ? " · " + D.statistika.nauji + " nauji" : "");

  function piesk(){
    var maxK  = parseFloat(document.getElementById("fKaina").value) || Infinity;
    var minP  = parseFloat(document.getElementById("fPlotas").value) || 0;
    var minM  = parseFloat(document.getElementById("fMetai").value) || 0;
    var rik   = document.getElementById("fRikiuoti").value;
    var tikZ  = document.getElementById("fZvaig").value;
    var zona  = document.getElementById("fZona").value;
    var bdz   = document.getElementById("fBiudzetas").value;

    var s = D.skelbimai.filter(function(r){
      if ((r.kaina || Infinity) > maxK) return false;
      if ((r.plotas || 0) < minP) return false;
      // Metai: nezinomi PRAEINA visada, tik pazymimi sarase.
      if (minM && r.metai && r.metai < minM) return false;
      if (!praeinaVietove(r)) return false;
      if (tikZ && !zvaigzdes[r.id]) return false;
      if (zona && zona.indexOf(r.zona) === -1) return false;
      if (bdz && !r.telpa) return false;
      return true;
    });

    s.sort(function(a,b){
      if (rik === "balas")       return (b.balas||0) - (a.balas||0);
      if (rik === "kaina")       return (a.kaina||1e9) - (b.kaina||1e9);
      if (rik === "kaina-desc")  return (b.kaina||0) - (a.kaina||0);
      if (rik === "plotas-desc") return (b.plotas||0) - (a.plotas||0);
      return (a.kaina/a.plotas||1e9) - (b.kaina/b.plotas||1e9);
    });

    document.getElementById("kiek").textContent = s.length;
    var box = document.getElementById("sarasas");
    box.innerHTML = "";

    if (!s.length){
      box.innerHTML = '<p class="tuscia">Pagal šiuos filtrus namų nėra. Pabandyk pakelti kainos ribą arba sumažinti plotą.</p>';
      return;
    }

    s.forEach(function(r){
      var d = document.createElement("article");
      d.className = "irasas";

      var uzm2 = (r.kaina && r.plotas) ? Math.round(r.kaina / r.plotas).toLocaleString("lt-LT") + " €/m²" : "";
      var zyma = r.zyma ? '<span class="zyma z-' + r.zyma + '">' + r.zyma + '</span><br>' : "";
      var sena = r.sena_kaina ? '<span class="senakaina">' + eur(r.sena_kaina) + '</span>' : "";

      d.innerHTML =
        '<img loading="lazy" alt="" src="' + (r.nuotrauka || "") + '">' +
        '<div>' + zyma +
          '<h2 class="vieta"><a href="' + r.url + '" target="_blank" rel="noopener">' +
             (r.vieta || r.pavadinimas || "Be pavadinimo") + '</a></h2>' +
          '<p class="duom">' +
            '<span><b>' + (r.plotas || "?") + '</b> m²</span>' +
            (r.sklypas ? '<span><b>' + r.sklypas + '</b> a sklypas</span>' : '') +
            (r.kambariai ? '<span><b>' + r.kambariai + '</b> kamb.</span>' : '') +
            (r.metai ? '<span>statyta <b>' + r.metai + '</b></span>'
                     : '<span style="color:#9b6a23">metai nežinomi</span>') +
            (r.sildymas ? '<span>' + r.sildymas + '</span>' : '') +
            (r.apdaila && r.apdaila !== 'nezinoma' ? '<span>' + r.apdaila + ' apdaila</span>' : '') +
          '</p>' +
          '<p class="saltinis">' + (r.zonos_aprasas || '') +
            (r.vietove_nepatikslinta ? ' · gyvenvietė nepatikslinta' : '') + '</p>' +
          '<p class="saltinis">' + r.saltinis +
            (r.galimas_dublikatas ? ' · tas pats namas ir ' + r.galimas_dublikatas.join(", ") : '') +
          '</p>' +
        '</div>' +
        '<div class="desine">' +
          '<div class="kaina">' + sena + eur(r.kaina) + '</div>' +
          '<div class="uzm2">' + uzm2 + '</div>' +
          '<div class="uzm2"' + (r.telpa ? ' style="color:var(--atpigo);font-weight:600"' : '') + '>su įrengimu ' +
             eur(r.bendra_kaina) + '</div>' +
          '<button class="zvaig" type="button" aria-pressed="' + (zvaigzdes[r.id] ? "true" : "false") +
            '" aria-label="Pažymėti kaip įdomų">★</button>' +
        '</div>';

      d.querySelector(".zvaig").addEventListener("click", function(){
        if (zvaigzdes[r.id]) { delete zvaigzdes[r.id]; } else { zvaigzdes[r.id] = 1; }
        issaugok();
        this.setAttribute("aria-pressed", zvaigzdes[r.id] ? "true" : "false");
        if (document.getElementById("fZvaig").value) piesk();
      });

      box.appendChild(d);
    });
  }

  ["fKaina","fPlotas","fMetai","fZona","fBiudzetas","fRikiuoti","fZvaig"].forEach(function(id){
    document.getElementById(id).addEventListener("change", piesk);
  });

  document.getElementById("vietVisos").addEventListener("click", function(){
    isjungtos = {}; irasykIsjungtas(); pieskMedi(); piesk();
  });
  document.getElementById("vietJokios").addEventListener("click", function(){
    isjungtos = {};
    D.skelbimai.forEach(function(r){
      isjungtos[teritorija(r)] = 1;
    });
    irasykIsjungtas(); pieskMedi(); piesk();
  });
  document.getElementById("vietArti").addEventListener("click", function(){
    isjungtos = {};
    D.skelbimai.forEach(function(r){
      if (teritorija(r) === "rajonas" && r.seniunija && r.seniunija !== "Sendvario")
        isjungtos["sen:" + r.seniunija] = 1;
    });
    irasykIsjungtas(); pieskMedi(); piesk();
  });

  // Peržiūrėti ranka
  var pat = D.patikrinti || [];
  document.getElementById("kiekPat").textContent = pat.length;
  document.getElementById("sarasasPat").innerHTML = pat.map(function(r){
    return '<li><a href="' + r.url + '" target="_blank" rel="noopener">' +
           (r.vieta || r.pavadinimas) + '</a> — ' + (r.atmesta || "") + '</li>';
  }).join("");

  // Dingę
  var din = D.dinge || [];
  if (din.length){
    document.getElementById("dingeBlokas").hidden = false;
    document.getElementById("kiekDinge").textContent = din.length;
    document.getElementById("sarasasDinge").innerHTML = din.map(function(r){
      return '<li>' + (r.vieta || r.pavadinimas) + ' — ' + eur(r.kaina) +
             ' (nebeskelbiama nuo ' + r.dinge + ')</li>';
    }).join("");
  }

  pieskMedi();
  piesk();
})();
</script>
</body>
</html>
