<!DOCTYPE html>
<html lang="lt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Namų paieška · Klaipėda</title>
<style>
:root{--bg:#f5f6f8;--kort:#fff;--rmb:#e2e5ea;--t:#1c2026;--pil:#6b7280;--ok:#0f766e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif}
header{background:#fff;border-bottom:1px solid var(--rmb);padding:16px 20px}
h1{margin:0;font-size:19px}
.sub{color:var(--pil);font-size:13px;margin-top:3px}
.filtrai{background:#fff;border-bottom:1px solid var(--rmb);padding:12px 20px;
 display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;position:sticky;top:0;z-index:9}
.l{display:flex;flex-direction:column;gap:3px}
.l label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--pil)}
input,select{padding:7px 9px;border:1px solid var(--rmb);border-radius:6px;font-size:14px;background:#fff}
input[type=number]{width:105px}
.sk{margin-left:auto;font-size:13px;color:var(--pil);padding-bottom:7px}
main{padding:18px 20px;display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(325px,1fr))}
.k{background:var(--kort);border:1px solid var(--rmb);border-radius:10px;padding:15px;
 display:flex;flex-direction:column;gap:7px}
.k.dingo{opacity:.5}
.k h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.k h3 a{color:inherit;text-decoration:none}
.k h3 a:hover{text-decoration:underline}
.kaina{font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.krito{font-size:12px;font-weight:600;color:#b91c1c}
.sena{font-size:12px;color:var(--pil);text-decoration:line-through;font-weight:400}
.e{display:flex;flex-wrap:wrap;gap:5px}
.z{font-size:11px;padding:3px 8px;border-radius:99px;background:#eef1f4;color:#374151}
.z.a{background:#d1fae5;color:#065f46}
.z.b{background:#e0f2fe;color:#075985}
.z.n{background:#fef3c7;color:#92400e;font-weight:600}
.z.d{background:#fee2e2;color:#991b1b}
.meta{font-size:12px;color:var(--pil);margin-top:auto;display:flex;justify-content:space-between;gap:8px}
.tuscia{padding:48px;text-align:center;color:var(--pil);grid-column:1/-1}
@media(max-width:640px){.filtrai{position:static}main{padding:12px;grid-template-columns:1fr}}
</style></head><body>
<header><h1>Namų paieška · Klaipėda ir rajonas</h1>
<div class="sub" id="antraste"></div></header>

<div class="filtrai">
 <div class="l"><label>Kaina iki €</label><input type="number" id="fK" step="5000"></div>
 <div class="l"><label>Plotas nuo m²</label><input type="number" id="fP" step="5"></div>
 <div class="l"><label>Kambarių nuo</label><input type="number" id="fR" value="3"></div>
 <div class="l"><label>Zona</label><select id="fZ"><option value="">Visos</option>
   <option>Klaipėdos miestas</option><option>Sendvario sen.</option><option>Klaipėdos r.</option></select></div>
 <div class="l"><label>Apdaila</label><select id="fA"><option value="">Bet kokia</option>
   <option>Dalinė apdaila</option><option>Neįrengtas</option><option>Įrengtas</option><option>Nenurodyta</option></select></div>
 <div class="l"><label>Rodyti</label><select id="fS">
   <option value="akt">Aktualius</option><option value="nauji">Tik naujus</option>
   <option value="krito">Kaina krito</option><option value="visi">Su pašalintais</option></select></div>
 <div class="l"><label>Rikiuoti</label><select id="fO">
   <option value="kaina">Kaina didėjant</option><option value="-kaina">Kaina mažėjant</option>
   <option value="-plotas">Plotas mažėjant</option><option value="-data">Naujausi</option></select></div>
 <div class="sk" id="sk"></div>
</div>
<main id="s"></main>

<script src="duomenys.js"></script>
<script>
const DB = window.DUOMENYS || {objektai:[], atnaujinta:"-", naujumas:14};
const O = DB.objektai, g = i => document.getElementById(i);
g('fK').value = DB.numatyta_kaina || '';
g('fP').value = DB.numatytas_plotas || 90;
g('antraste').textContent = `Atnaujinta ${DB.atnaujinta} · ${O.length} objektų bazėje`
  + (DB.gimnazija ? ` · mokykla: ${DB.gimnazija}` : '');
const sk = n => n==null ? '—' : String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const dienos = d => d ? Math.floor((new Date() - new Date(d))/864e5) : 999;

function piesti(){
 const kK=+g('fK').value||1e9, kP=+g('fP').value||0, kR=+g('fR').value||0,
       zZ=g('fZ').value, aA=g('fA').value, sS=g('fS').value, oO=g('fO').value;
 let x = O.filter(o=>{
   if(sS==='akt'   && !o.aktyvus) return false;
   if(sS==='nauji' && (!o.aktyvus || dienos(o.pirma_karta) > (DB.naujumas||14))) return false;
   if(sS==='krito' && !(o.kainos_istorija && o.kainos_istorija.length>1)) return false;
   return (o.kaina==null||o.kaina<=kK) && (o.plotas==null||o.plotas>=kP) &&
          (o.kambariai==null||o.kambariai>=kR) && (!zZ||o.zona===zZ) && (!aA||o.apdaila===aA);
 });
 const r={kaina:(a,b)=>(a.kaina??9e9)-(b.kaina??9e9),'-kaina':(a,b)=>(b.kaina??0)-(a.kaina??0),
   '-plotas':(a,b)=>(b.plotas??0)-(a.plotas??0),
   '-data':(a,b)=>String(b.paskelbta||b.pirma_karta).localeCompare(String(a.paskelbta||a.pirma_karta))};
 x.sort(r[oO]);
 g('sk').textContent = `rodoma ${x.length} iš ${O.length}`;
 g('s').innerHTML = x.length ? x.map(o=>{
   const ist=o.kainos_istorija||[], krito=ist.length>1 && ist[ist.length-1].kaina < ist[0].kaina;
   const nauj = o.aktyvus && dienos(o.pirma_karta) <= (DB.naujumas||14);
   return `<div class="k${o.aktyvus?'':' dingo'}">
    <h3><a href="${o.url}" target="_blank" rel="noopener">${o.pavadinimas||'(be pavadinimo)'}</a></h3>
    <div class="kaina">${o.kaina?sk(o.kaina)+' €':'kaina nenurodyta'}
      ${krito?`<span class="sena">${sk(ist[0].kaina)} €</span><span class="krito">↓ ${sk(ist[0].kaina-o.kaina)} €</span>`:''}</div>
    <div class="e"><span class="z a">${o.zona}</span>
      ${o.plotas?`<span class="z">${o.plotas} m²</span>`:'<span class="z">plotas ?</span>'}
      ${o.kambariai?`<span class="z">${o.kambariai} kamb.</span>`:''}
      <span class="z b">${o.apdaila}</span>
      ${nauj?'<span class="z n">NAUJAS</span>':''}
      ${o.aktyvus?'':'<span class="z d">nebeskelbiamas</span>'}</div>
    <div class="meta"><span>${o.saltinis}</span>
      <span>${o.paskelbta?'paskelbta '+o.paskelbta:'rasta '+o.pirma_karta}</span></div></div>`;
 }).join('') : '<div class="tuscia">Pagal šiuos filtrus nieko nerasta.</div>';
}
['fK','fP','fR','fZ','fA','fS','fO'].forEach(i=>g(i).addEventListener('input',piesti));
piesti();
</script></body></html>
